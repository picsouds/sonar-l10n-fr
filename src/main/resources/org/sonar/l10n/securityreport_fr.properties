securityreport.standard.summary.cra=Identifiez et comblez les lacunes de sécurité par rapport à la réglementation européenne <link>Cyber Resilience Act</link> (CRA). Ce rapport suit vos progrès par rapport aux exigences de l'Annexe I, en mettant en évidence précisément là où votre logiciel s'écarte de la norme.
securityreport.standard.summary.cra.information=Information : Pour répondre aux exigences du règlement européen sur la résilience cybernétique (Cyber Resilience Act), veuillez activer <advancedSecurityLink>SonarQube Advanced Security</advancedSecurityLink>. Cela fournit la nomenclature logicielle (SBOM) et l'analyse des dépendances nécessaires pour maintenir une posture de sécurité conforme.
