property.category.security.bitbucket=Bitbucket
property.category.security.bitbucket.description=Pour activer l'authentification Bitbucket :<ul><li>SonarQube doit être accessible publiquement uniquement via HTTPS</li><li>La propriété 'sonar.core.serverBaseURL' doit être configurée avec cette URL HTTPS publique</li><li>Dans votre profil Bitbucket, vous devez créer un consommateur OAuth pour lequel l'URL de rappel (« Callback URL ») doit être définie sur <code>'&lt;valeur_de_la_propriété_sonar.core.serverBaseURL&gt;/oauth2/callback'</code>, et la permission doit être configurée sur Account:Read</li></ul>


