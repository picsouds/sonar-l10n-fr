component_measures.overview.project_overview.subnavigation=Aperçu du projet
component_measures.overview.project_overview.title=Risque
component_measures.overview.project_overview.description=Obtenez un aperçu rapide des risques opérationnels. Pour les utilisateurs utilisant le clavier, les éléments sont triés par nombre de lignes de code pour chaque fichier. Toute couleur autre que le vert indique des risques immédiats : des bugs ou des vulnérabilités qui devraient être examinés. Une position en haut ou à droite du graphique signifie que la santé à long terme peut être menacée. Les bulles vertes en bas à gauche sont les meilleures.
component_measures.overview.Reliability.description=Consultez les risques opérationnels liés aux bugs. Pour les utilisateurs utilisant le clavier, les éléments sont triés par volume de bugs par fichier. Plus la couleur d'une bulle est proche du rouge, plus les bugs les plus graves sont sévères. La taille des bulles indique le volume de bugs, et la position verticale de chaque bulle reflète le temps estimé pour les corriger. Les petites bulles vertes situées sur le bord inférieur sont les meilleures.
component_measures.overview.Security.description=Consultez les risques opérationnels liés aux vulnérabilités. Pour les utilisateurs utilisant le clavier, les éléments sont triés par volume de vulnérabilités par fichier. Plus la couleur d'une bulle est proche du rouge, plus les vulnérabilités les plus graves sont sévères. La taille des bulles indique le volume de vulnérabilités, et la position verticale de chaque bulle reflète le temps estimé pour les corriger. Les petites bulles vertes situées sur le bord inférieur sont les meilleures.
component_measures.overview.Maintainability.description=Consultez les risques à long terme liés aux mauvaises pratiques. Pour les utilisateurs utilisant le clavier, les éléments sont triés par volume de "Mauvaises pratiques" pour chaque fichier. Plus la couleur d'une bulle est proche du rouge, plus le ratio de dette technique est élevé. La taille des bulles indique le volume de "Mauvaises pratiques", et la position verticale de chaque bulle reflète le temps estimé pour les corriger. Les petites bulles vertes situées sur le bord inférieur sont les meilleures.
component_measures.overview.Coverage.description=Consultez les risques à long terme liés au manque de couverture de tests. Pour les utilisateurs utilisant le clavier, les éléments sont triés par volume de lignes non couvertes par fichier. La taille des bulles indique le volume de lignes non couvertes, et la position verticale de chaque bulle reflète le volume de couverture manquante. Les petites bulles situées sur le bord inférieur sont les meilleures.
component_measures.overview.Duplications.description=Consultez les risques à long terme liés aux duplications. Pour les utilisateurs utilisant le clavier, les éléments sont triés par le nombre de blocs dupliqués par fichier. La taille des bulles indique le volume de blocs dupliqués, et la position verticale de chaque bulle reflète le volume de lignes dans ces blocs. Les petites bulles situées sur le bord inférieur sont les meilleures.
component_measures.overview.see_data_as_list=Consultez les données présentées sur ce graphique sous forme de liste
