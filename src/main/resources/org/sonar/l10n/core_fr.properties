issue.clean_code_attribute=Code attribute
issue.clean_code_attribute.CLEAR=Pas clair
issue.clean_code_attribute.CLEAR.title=Ceci est un défaut d’intentionnalité, le code n’est pas suffisamment clair.
issue.clean_code_attribute.CLEAR.advice=Pour être clair, le code doit être auto-explicatif et communiquer sa fonctionnalité de manière transparente.
issue.clean_code_attribute.COMPLETE=Pas complet
issue.clean_code_attribute.COMPLETE.title=Ceci est un défaut d’intentionnalité, le code n’est pas suffisamment complet.
issue.clean_code_attribute.COMPLETE.advice=Pour être complet, le code doit être fonctionnel et atteindre ses objectifs implicites grâce à des constructions de code exhaustives, adéquates et complètes.
issue.clean_code_attribute.CONVENTIONAL=Pas conventionnel
issue.clean_code_attribute.CONVENTIONAL.title=Ceci est un défaut de cohérence, le code n’est pas suffisamment conventionnel.
issue.clean_code_attribute.CONVENTIONAL.advice=Pour être conventionnel, le code doit accomplir les tâches avec les instructions attendues et respecter un choix unique sur toutes les instances face à des options également valables.
issue.clean_code_attribute.DISTINCT=Pas distinct
issue.clean_code_attribute.DISTINCT.title=Ceci est un défaut d’adaptabilité, le code n’est pas suffisamment distinct.
issue.clean_code_attribute.DISTINCT.advice=Pour être distinct, le code doit avoir des procédures et des données uniques et distinctives, sans duplication inutile.
issue.clean_code_attribute.EFFICIENT=Pas efficient
issue.clean_code_attribute.EFFICIENT.title=Ceci est un défaut d’intentionnalité, le code n’est pas suffisamment efficient.
issue.clean_code_attribute.EFFICIENT.advice=Pour être efficient, le code doit utiliser les ressources sans gaspillage inutile et privilégier les options économiques lorsque disponibles.
issue.clean_code_attribute.FOCUSED=Pas ciblé
issue.clean_code_attribute.FOCUSED.title=Ceci est un défaut d’adaptabilité, le code n’est pas suffisamment ciblé.
issue.clean_code_attribute.FOCUSED.advice=Pour être ciblé, le code doit avoir une portée unique, étroite et spécifique. Chacune de ses unités ne doit avoir qu’un seul objectif concis.
issue.clean_code_attribute.FORMATTED=Mal formaté
issue.clean_code_attribute.FORMATTED.title=Ceci est un défaut de cohérence, le code n’est pas suffisamment formaté.
issue.clean_code_attribute.FORMATTED.advice=Pour être formaté, le code doit être présenté de manière systématique et régulière, avec les mêmes choix non sémantiques appliqués sur l’ensemble de la base de code.
issue.clean_code_attribute.IDENTIFIABLE=Pas identifiable
issue.clean_code_attribute.IDENTIFIABLE.title=Ceci est un défaut de cohérence, le code n’est pas suffisamment identifiable.
issue.clean_code_attribute.IDENTIFIABLE.advice=Pour être identifiable, le code doit inclure des noms et identifiants avec une structure régulière basée sur les conventions du langage.
issue.clean_code_attribute.LAWFUL=Pas légal
issue.clean_code_attribute.LAWFUL.title=Ceci est un défaut de responsabilité, le code n’est pas suffisamment légal.
issue.clean_code_attribute.LAWFUL.advice=Pour être légal, le code doit respecter les licences et les règles de copyright.
issue.clean_code_attribute.LOGICAL=Pas logique
issue.clean_code_attribute.LOGICAL.title=Ceci est un défaut d’intentionnalité, le code n’est pas suffisamment logique.
issue.clean_code_attribute.LOGICAL.advice=Pour être logique, le code doit avoir des instructions bien formées et cohérentes, fonctionnant ensemble, et exemptes d’erreurs explicites.
issue.clean_code_attribute.MODULAR=Pas modulaire
issue.clean_code_attribute.MODULAR.title=Ceci est un défaut d’adaptabilité, le code n’est pas suffisamment modulaire.
issue.clean_code_attribute.MODULAR.advice=Pour être modulaire, le code doit être organisé et distribué pour souligner la séparation entre ses différentes parties.
issue.clean_code_attribute.RESPECTFUL=Pas respectueux
issue.clean_code_attribute.RESPECTFUL.title=Ceci est un défaut de responsabilité, le code n’est pas suffisamment respectueux.
issue.clean_code_attribute.RESPECTFUL.advice=Pour être respectueux, le code doit s’abstenir d’utiliser un langage discriminatoire ou offensant.
issue.clean_code_attribute.TESTED=Pas testé
issue.clean_code_attribute.TESTED.title=Ceci est un défaut d’adaptabilité, le code n’est pas suffisamment testé.
issue.clean_code_attribute.TESTED.advice=Pour être testé, le code doit disposer de tests fonctionnels automatisés qui garantissent la fiabilité de son fonctionnement.
issue.clean_code_attribute.TRUSTWORTHY=Pas fiable
issue.clean_code_attribute.TRUSTWORTHY.title=Ceci est un défaut de responsabilité, le code n’est pas suffisamment fiable.
issue.clean_code_attribute.TRUSTWORTHY.advice=Pour être fiable, le code doit s’abstenir de révéler ou d’inclure en dur des informations privées.
