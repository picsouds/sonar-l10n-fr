settings.mode.title=Mode
settings.mode.description.line1=Deux options permettent de refléter l’état de santé de tous les projets de cette instance : {mqrLink} et {standardLink}
settings.mode.description.line2=Changer de mode modifiera la façon dont les défauts sont catégorisés et classés en fonction des résultats de l’analyse pour tous les utilisateurs.
settings.mode.checking_instance=Vérification de votre instance...
settings.mode.instance_conditions_from_other_mode=Certaines barrières qualité de cette instance utilisent des métriques qui appartiennent à la {isStandardMode, select, true {Standard Experience} other {Multi-Quality Rule Mode}}. Vous pourrez les mettre à jour une fois les modifications enregistrées.
settings.mode.standard.name=Standard Experience
settings.mode.mqr.name=Multi-Quality Rule (MQR) Mode
settings.mode.standard.description.line1=Couvre l’utilisation traditionnelle des types de règles tels que les bugs, les mauvaises pratiques de code et les vulnérabilités, avec une seule catégorie et un seul niveau de sévérité pour chaque règle.
settings.mode.standard.description.line2=Cette approche consiste à attribuer un niveau de sévérité à une règle et à ses défauts en fonction de la qualité logicielle unique (par exemple, Sécurité, Fiabilité ou Maintenabilité) sur laquelle elle a le plus d’impact. C’est la catégorisation des règles utilisée dans {productName} 9.9 LTA et les versions antérieures.
settings.mode.mqr.description.line1=Vise à représenter plus précisément l’impact des défauts sur toutes les qualités logicielles. Très peu de défauts n’affectent qu’une seule qualité logicielle. Par exemple, la plupart des vulnérabilités sont également des bugs, et inversement. Le mode Multi-Quality Rule (MQR) associe chaque règle à chacune des qualités qu’elle impacte, avec un niveau de sévérité distinct pour chaque qualité.
settings.mode.mqr.description.line2=Cette approche consiste à s’assurer que l’impact d’un défaut sur toutes les qualités logicielles est clair, et pas seulement sur celle la plus sévèrement affectée.
settings.mode.save.warning=Enregistrez les modifications pour qu’elles soient appliquées à votre instance
settings.mode.save=Sauvegardez le mode : le mode actuel sera basculé vers {isStandardMode, select, true {Standard Experience} other {Multi-Quality Rule Mode}}
settings.mode.save.success=Cette instance est maintenant en {isStandardMode, select, true {Standard Experience} other {Multi-Quality Rule Mode}}.
mode.standard.advertisement=Vous souhaitez voir les défauts par Sécurité, Fiabilité et Maintenabilité ? Si votre équipe préfère travailler avec les qualités logicielles, modifiez cette option dans les <a>settings</a>
