dependencies.risk.how.title=Mettre à jour la dépendance
dependencies.risk.how.body=Si une version actualisée de la dépendance corrigeant la vulnérabilité est disponible, mettez-la à jour vers cette version. Testez toujours votre application de manière approfondie après la mise à jour d'une dépendance pour vous assurer qu'aucun élément ne se rompt.
dependencies.risk.how_introduced_tab=Où se trouve-t-elle ?
dependencies.risk.how.find_alternative=Trouver une alternative
dependencies.risk.how.find_alternative.vulnerability_body=Si aucune mise à jour n'est disponible, envisagez de passer à une autre dépendance offrant la même fonctionnalité, mais sans la vulnérabilité.
dependencies.risk.how.find_alternative.license_body=La licence de cette dépendance étant interdite par le profil de licence {profile}, vous devrez trouver une autre dépendance pour répondre à vos besoins.
dependencies.risk.how.license.view_allowed=Afficher les licences autorisées pour ce projet
