sca.licenses.category.permissive_standard=Cette catégorie comprend les licences permissives les plus couramment utilisées. Les licences permissives accordent de larges autorisations d'utilisation et de modification, avec de très minimes obligations (principalement l'attribution). Les licences de cette catégorie possèdent tous les éléments essentiels des licences open source permissives. Des exemples de licences permissives standards incluent les licences de logiciels MIT et Apache.
sca.licenses.category.permissive_amateur=Cette catégorie comprend les licences permissives qui manquent d'un ou de plusieurs éléments essentiels des licences open source permissives modernes, ou qui imposent des exigences complexes ou déroutantes. Beaucoup utilisent un langage flou, humoristique ou incomplet. Ces licences peuvent être considérées comme moins prévisibles sur le plan juridique. Des exemples de licences permissives non standard incluent les licences de logiciels Artistic 1.0 et WTFPL.
sca.licenses.category.copyleft_weak=Les licences Weak copyleft exigent que vous partagiez vos modifications et ajouts au logiciel sous licence lorsque vous en fournissez des copies à des tiers. Des exemples de licences copyleft faibles incluent les licences de logiciels GNU LGPL et Mozilla Public License.
sca.licenses.category.copyleft_strong=En plus des exigences des licences Weak copyleft, les licences Strong copyleft vous obligent à partager les programmes plus vastes que vous construisez avec le logiciel sous licence lorsque vous en fournissez des copies à des tiers. Des exemples de licences Strong copyleft incluent la licence GNU GPL.
sca.licenses.category.copyleft_network=En plus des exigences des licences Strong copyleft, les licences Network copyleft vous obligent à partager les programmes plus vastes que vous construisez avec le logiciel sous licence non seulement lorsque vous en donnez des copies à des tiers, mais aussi lorsque vous exécutez le logiciel pour que des tiers l'utilisent sur Internet ou sur un autre réseau. Des exemples de licences Network copyleft incluent les licences de logiciels GNU AGPL et Server-Side Public License.
sca.licenses.category.copyleft_maximal=Les licences Maximal copyleft répondent différemment des autres familles à la question "À quel moment la licence exige-t-elle un partage ?". Les licences Maximal copyleft vous obligent à partager le logiciel que vous créez avec des tiers, et à concéder ce logiciel sous les mêmes conditions lorsque vous le faites. Des exemples de licences Maximal copyleft incluent les licences de logiciels Parity et Reciprocal.
sca.licenses.category.uncategorized=De nombreuses licences détectables ne rentrent pas dans l'une des catégories standard, généralement en raison d'exigences non standard. Ces exigences non standard peuvent inclure des limites sur l'utilisation commerciale, des clauses de moralité, des obligations d'achat de licences commerciales basées sur divers facteurs ou des exigences de reporting inhabituelles. Les logiciels peuvent également ne pas être sous licence, les auteurs se réservant tous les droits. Toute licence de la catégorie "Autre" doit être examinée et configurée individuellement en fonction des conditions de licence spécifiques et du cas d'utilisation.
sca.licenses.category.policy_not_configurable=Impossible de définir des règles pour cette catégorie.
sca.licenses.project.title=Profil de licence
sca.licenses.project.info=Un {licenseProfileDocUrl} est un ensemble de règles qui définissent quelles licences sont autorisées ou interdites pour les dépendances utilisées par vos projets. Les licences des dépendances ne seront analysées que si un profil de licence par défaut est créé, ou si des projets se voient attribuer manuellement un profil de licence. Si une dépendance dotée d'une licence interdite est détectée lors d'une analyse, elle sera signalée comme une {dependencyRiskDocUrl}.
sca.licenses.project.choose=Choisissez le profil de licence à assigner à ce projet ou créez un nouveau profil à partir de la page {licenseProfilesUrl}.
