dependencies.risk.how.fix.partial=Correction partielle
dependencies.risk.how.fix.none=Version affectée
dependencies.risk.how.wait_for_fix=Attendre une correction
dependencies.risk.how.wait_for_fix.body=Vous utilisez la dernière version de cette dépendance et aucune version plus récente n'est disponible pour résoudre la vulnérabilité. Si vous avez l'assurance que la dépendance est activement maintenue et qu'un correctif sera bientôt publié, il peut être judicieux d'attendre la mise à jour.
dependencies.risk.how.fix_body.version_in_use.complete=Il s'agit de la version de la dépendance que vous utilisez, mais elle n'est pas affectée.
dependencies.risk.how.fix_body.version_in_use.unknown=Il s'agit de la version de la dépendance que vous utilisez, mais nous ne disposons d'aucune donnée à son sujet. Elle est peut-être affectée ou non.
dependencies.risk.how.fix_body.version_in_use.default=Il s'agit de la version affectée de la dépendance que vous utilisez.
dependencies.risk.how.fix_body.nearest_partial=Il s'agit de la version la plus proche qui corrige cette vulnérabilité, mais elle présente {vulnerabilityIdCount} autre(s) {vulnerabilityIdCount, plural, one {vulnérabilité} other {vulnérabilités}}.
dependencies.risk.how.fix_body.nearest_complete=Il s'agit de la version la plus proche sans aucune vulnérabilité connue.
dependencies.risk.how.fix_body.latest_partial=Il s'agit de la dernière version qui corrige cette vulnérabilité, mais elle présente {vulnerabilityIdCount} autre(s) {vulnerabilityIdCount, plural, one {vulnérabilité} other {vulnérabilités}}.
dependencies.risk.how.fix_body.latest_complete=Il s'agit de la dernière version sans aucune vulnérabilité connue.
dependencies.risk.how.fix_body.latest_stable.complete=Il s'agit de la dernière version non-prerelease sans aucune vulnérabilité connue.
dependencies.risk.how.fix_body.latest_stable.partial=Il s'agit de la dernière version non-prerelease qui corrige cette vulnérabilité, mais elle présente {vulnerabilityIdCount} autre(s) {vulnerabilityIdCount, plural, one {vulnérabilité} other {vulnérabilités}}.
dependencies.risk.how.fix_body.latest_stable.default=This is the latest non-prerelease version but it does not fix this vulnerability{vulnerabilityIdCount, plural, =1 {.} other { and has # other vulnerabilities.}}
dependencies.risk.how.fix_body.latest_prerelease.complete=Il s'agit de la dernière prerelease sans aucune vulnérabilité connue.
dependencies.risk.how.fix_body.latest_prerelease.partial=Il s'agit de la dernière prerelease qui corrige cette vulnérabilité, mais elle présente {vulnerabilityIdCount} autre(s) {vulnerabilityIdCount, plural, one {vulnérabilité} other {vulnérabilités}}.
dependencies.risk.how.fix_body.latest_prerelease.default=This is the latest prerelease version but it does not fix this vulnerability{vulnerabilityIdCount, plural, =1 {.} other { and has # other vulnerabilities.}}
dependencies.risk.how.no_guidance=Les conseils de correction ne sont pas encore disponibles dans Sonar pour cette vulnérabilité. Vous devrez déterminer manuellement si une version non affectée est disponible pour la mise à jour. Veuillez consulter les informations de la section "Quel est le risque ?" pour obtenir des conseils sur les versions affectées.
dependencies.risk.how.malware.body=Bien que chaque cas de paquet malveillant soit différent, voici quelques principes généraux pour vous guider. Informez immédiatement votre équipe de sécurité des informations. Supprimez le paquet de votre projet en le désinstallant et en l'ôtant de vos fichiers de dépendances. Réinitialisez tous les secrets et identifiants qui ont pu être exposés, notamment les clés API, mots de passe, jetons et certificats. Effectuez cette opération à partir d'un autre ordinateur sécurisé. Vérifiez si votre système a été compromis en contrôlant la présence de processus inattendus, de connexions réseau ou de modifications de fichiers. Envisagez une restauration à partir d'une sauvegarde propre ou une ré-installation des systèmes affectés. Mettez à jour vers une version sûre si elle existe, ou trouvez un paquet alternatif. Consultez le dépôt du paquet et les avis de sécurité pour obtenir des conseils. Analysez votre base de code pour y détecter tout code malveillant qui aurait pu être injecté dans vos fichiers de projet lors de l'exécution du paquet. Révisez vos pratiques de sécurité, y compris la manière dont vous évaluez les dépendances, et envisagez d'utiliser des outils qui analysent la présence de paquets malveillants avant l'installation.
dependencies.risk.how.withdrawn=Cet avis a été retiré par la source, car le rapport s'est avéré non valide. Sonar affiche cet enregistrement par souci de transparence, mais aucun correctif ni aucune remédiation n'est nécessaire.
sca.licenses.page=Profils de licence
sca.licenses.page.intro=Un profil de licence est un ensemble de règles qui définissent quelles licences sont autorisées ou interdites pour les dépendances utilisées par vos projets. Si une dépendance dotée d'une licence interdite est détectée lors d'une analyse, elle sera signalée comme un risque de dépendance. Pour plus de détails, consultez la documentation relative à {docsLink}.
sca.licenses.page.no_profiles.title=Les licences des dépendances ne seront pas analysées tant qu'un profil de licence n'aura pas été créé.
sca.licenses.page.no_profiles.body=Pour analyser les licences d'un projet, un profil de licence doit lui être attribué. Vous pouvez choisir manuellement les projets à analyser ou définir un profil par défaut pour tous les projets.
sca.licenses.create_profile=Créer un profil
sca.licenses.details_page.intro=Les profils de licence sont utilisés pour définir des règles qui déterminent quelles licences sont autorisées ou interdites pour les dépendances utilisées par vos projets. Si une dépendance dotée d'une licence interdite est détectée lors d'une analyse, elle sera signalée comme un risque de dépendance.
sca.licenses.license_override_applied=La règle par défaut pour les licences de catégorie {licenseCategory} est {defaultPolicy}. Vous avez remplacé la règle par défaut par {policy}.
sca.licenses.default_policy.body=Il s'agit de votre profil de licence {defaultBadge}. Tous les projets qui ne se voient pas attribuer manuellement un autre profil utiliseront celui-ci.
sca.licenses.default_policy.no_default=Vous n'avez pas défini de profil de licence par défaut. Si un profil de licence est défini comme par défaut, tous vos projets utiliseront ce profil lors de l'analyse, à moins qu'ils ne se voient attribuer manuellement un autre profil.
sca.licenses.default_policy.nothing_allowed=Ce profil de licence est défini par défaut, mais aucune licence ni aucune catégorie de licence n'a été autorisée. Dans cet état, l'analyse indiquera aux développeurs que toutes les licences sont interdites. Si vous ne prévoyez pas de configurer immédiatement les licences autorisées, nous vous recommandons d'attendre d'avoir effectué la configuration avant de définir ce profil comme profil par défaut.
sca.licenses.policy.nothing_allowed=Ce profil de licence ne comporte aucune licence ni aucune catégorie de licence autorisée. Dans cet état, l'analyse indiquera aux développeurs que toutes les licences sont interdites. Si vous ne prévoyez pas de configurer immédiatement les licences autorisées, nous vous recommandons d'attendre d'avoir effectué la configuration avant de définir ce profil comme profil par défaut.
