settings.early_access.title=Fonctionnalités en accès anticipé
settings.early_access.description=Les fonctionnalités listées ci-dessous sont proposées gratuitement dans le cadre d'un essai en accès anticipé, à la discrétion de Sonar. L'essai peut être interrompu à tout moment. Votre organisation ne sera pas facturée pour leur utilisation pendant l'essai. Des conditions générales peuvent s'appliquer.
settings.early_access.misra.title=Conformité MISRA
settings.early_access.misra.description.line1=Activez cette fonctionnalité pour prévisualiser des règles MISRA C++2023 supplémentaires.
settings.early_access.misra.description.line2=À la fin de l'essai, les fonctionnalités en accès anticipé de conformité MISRA seront désactivées et toutes les nouvelles règles MISRA C++2023 seront supprimées des profilés de qualité. Votre organisation ne sera pas facturée.
settings.early_access.misra.checkbox_label=Activer l'accès anticipé à la conformité MISRA
settings.early_access.misra.dialog_title=You are about to {enable, select, true {enable} other {disable}} early access trial to MISRA Compliance feature
settings.early_access.misra.dialog_description.enable=Un aperçu des règles MISRA C++2023 supplémentaires sera disponible pour cette instance. <p>Sonar peut interrompre l'essai à tout moment. Lorsqu'il s'arrêtera, les fonctionnalités en accès anticipé de conformité MISRA seront désactivées, toutes les nouvelles règles MISRA C++2023 seront supprimées des profils de qualité et tous les problèmes détectés associés seront fermés.</p> Votre organisation ne sera pas facturée.
settings.early_access.misra.dialog_description.disable=Toutes les nouvelles règles MISRA C++2023 seront supprimées des profils de qualité, et tous les problèmes détectés associés seront fermés. Tant que l'accès anticipé à cette fonctionnalité est disponible, vous pourrez la réactiver. <p>Voulez-vous vraiment continuer ?</p>
