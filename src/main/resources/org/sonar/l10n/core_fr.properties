sandboxed_issues_intro.img_alt=Image montrant un exemple de problèmes en mode bac à sable sur la page de résumé qui n'impactent pas la barrière qualité. De plus, le nouveau statut de défaut "Dans le bac à sable" est affiché pour un défaut dans la liste des défauts.
sandboxed_issues_intro.description_1=Dites adieu aux échecs de pipelines inattendus. Nous introduisons le bac à sable des défauts pour rendre les mises à jour de la plateforme sans stress. Les nouveaux défauts signalés par des analyseurs mis à jour sont placés dans un "bac à sable" — visibles par vous, mais exclus des calculs de la barrière qualité.
sandboxed_issues_intro.description_2=<b>Activez ce paramètre avant la première analyse de votre projet</b> suite à la mise à jour de SonarQube afin de maintenir vos pipelines au vert et de laisser à vos équipes le temps de traiter les défauts à leur propre rythme.
