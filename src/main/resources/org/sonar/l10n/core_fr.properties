overview.quality_gate.ignored_conditions.tooltip=Au début d'une période de nouveau code, si très peu de lignes ont été ajoutées ou modifiées, il peut être difficile d'atteindre le niveau souhaité de couverture du code ou de duplications. Pour éviter l'échec de la barrière qualité lorsqu'il n'y a pas grand-chose à faire, les conditions de la barrière qualité concernant les duplications dans le nouveau code et la couverture du nouveau code sont ignorés jusqu'à ce que le nombre de nouvelles lignes soit d'au moins 20. Un administrateur peut désactiver cette fonction dans les paramètres généraux.
