architecture.page.structural_flaws_description=Affiche les problèmes du code source qui existent indépendamment de l'architecture visée. Un exemple courant est un tangle, où plusieurs fichiers ou classes forment des dépendances cycliques qui se chevauchent et où chacun peut atteindre les autres par le biais de liens de dépendance.
