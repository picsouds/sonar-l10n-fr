sca.licenses.set_category_modal.title=Définir les règles de licence par défaut
sca.licenses.set_category_modal.body=Sonar a catégorisé de nombreuses licences open source courantes en fonction de leurs caractéristiques pour vous simplifier la définition des règles. La définition d'une règle par défaut par catégorie vous permet d'autoriser ou d'interdire rapidement toutes les licences de cette catégorie. Ne vous inquiétez pas, vous pourrez toujours configurer les règles pour des licences individuelles si nécessaire.
