quality_profiles.intro=Les profils qualité sont des ensembles de règles à appliquer lors d'une analyse. Pour chaque langage, il existe un profil par défaut. Tous les projets qui ne sont pas explicitement assignés à un autre profil seront analysés avec le profil par défaut. Idéalement, tous les projets utiliseront le même profil pour un langage donné. <p1>Un profil qualité strict est nécessaire pour les projets qui contiennent du code généré par l'IA.</p1> <p2> Nous recommandons d'utiliser le profil qualité Sonar way. En savoir plus sur <link>les profils qualité dans notre documentation</link></p2>
quality_profiles.list.projects=Projets
quality_profiles.list.projects.help=Les projets affectés à un profil seront toujours analysés avec celui-ci pour ce langage, quel que soit le profil par défaut. Les administrateurs gérant les profils qualité peuvent affecter des projets à un profil qui n'est pas le profil par défaut ou faire en sorte qu'il suive toujours le profil par défaut du système. Les administrateurs peuvent choisir n'importe quel profil pour chaque langage.
