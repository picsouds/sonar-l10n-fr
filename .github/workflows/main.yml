name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - '25.*'
  pull_request:
    branches:
      - main      

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze
        run:  mvn verify sonar:sonar -B -e -V
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Artifact JAR for release
        uses: actions/upload-artifact@v4
        with:
          name: sonar-l10n-fr-jar
          path: target/

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download target artifact from build for release
        uses: actions/download-artifact@v4
        with:
          name: sonar-l10n-fr-jar
          path: target

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Verify POM version matches tag
        run: |
          POM_VERSION=$(xmllint --xpath "/*[local-name()='project']/*[local-name()='version']/text()" pom.xml)
          if [[ "$POM_VERSION" != "${GITHUB_REF_NAME}"* ]]; then
            echo "Error: POM version ($POM_VERSION) does not match tag ($GITHUB_REF_NAME)"
            exit 1
          fi

      - name: Extract changelog for release
        id: changelog
        run: |
          TAG=${GITHUB_REF_NAME}
          CHANGELOG=$(awk "/## ${TAG}/{flag=1; next}/## /{flag=0}flag" CHANGELOG.md)
          if [ -z "$CHANGELOG" ]; then
            echo "Warning: No changelog entry found for ${TAG}"
            CHANGELOG="No changelog entry found for ${TAG}"
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Find JAR file
        id: find_jar
        run: |
          JAR_FILE=$(ls target/*.jar | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "Error: No JAR file found in target/"
            exit 1
          fi
          echo "jar_path=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "jar_name=$(basename $JAR_FILE)" >> $GITHUB_OUTPUT

      - name: Create Release and upload JAR
        # softprops/action-gh-release@v2 , see https://github.com/softprops/action-gh-release/releases/tag/v2
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ env.CHANGELOG }}
          draft: false
          prerelease: false
          files: ${{ steps.find_jar.outputs.jar_path }}
